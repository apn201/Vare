# Apache reverse proxy for Väre. Needs: a2enmod proxy proxy_http headers
#
# Option A, a sub-path of an existing site (e.g. https://helppox.com/vare/).
# Put these lines inside the existing <VirtualHost *:443> for that site.
RedirectMatch 301 ^/vare$ /vare/
ProxyPass        /vare/ http://127.0.0.1:8765/
ProxyPassReverse /vare/ http://127.0.0.1:8765/
# a full run makes several Qloo and LLM calls; allow up to 2 minutes
ProxyTimeout 120

# Option B, its own subdomain (e.g. https://vare.helppox.com/), as a new vhost:
# <VirtualHost *:443>
#     ServerName vare.helppox.com
#     ProxyPreserveHost On
#     ProxyPass        / http://127.0.0.1:8765/
#     ProxyPassReverse / http://127.0.0.1:8765/
#     ProxyTimeout 120
#     # TLS lines as for the other vhosts (certbot --apache -d vare.helppox.com)
# </VirtualHost>
